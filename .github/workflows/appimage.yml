name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-notify-0.7 \
            librsvg2-bin desktop-file-utils file
          python3 -m pip install --break-system-packages pyinstaller pytest pytest-mock

      - name: Version sync
        run: |
          pyproject="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          module="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/upkeep/__init__.py)"
          if [ "$pyproject" != "$module" ]; then
            echo "::error::pyproject.toml ($pyproject) and __init__.py ($module) disagree"
            exit 1
          fi
          echo "version $pyproject"

      - name: Tests
        run: PYTHONPATH=src python3 -m pytest tests/ -q

      - name: appimagetool
        run: |
          curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: ./packaging/build-appimage.sh "${GITHUB_REF_NAME#v}"
        env:
          ARCH: x86_64

      - name: Smoke test
        run: |
          IMG="$(ls Upkeep-*-x86_64.AppImage | head -1)"
          chmod +x "$IMG"
          "$IMG" list
          # `self` exits 0 current, 10 newer, 1 no release yet / offline.
          "$IMG" self || [ $? -le 10 ]

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Upkeep-*-x86_64.AppImage \
            --title "Upkeep $GITHUB_REF_NAME" \
            --generate-notes