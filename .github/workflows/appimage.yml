name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-notify-0.7 \
            librsvg2-bin desktop-file-utils file
          python3 -m pip install --break-system-packages pyinstaller pytest pytest-mock

      # pyproject.toml is canonical. workflow_dispatch has no tag, so taking
      # the version from GITHUB_REF_NAME would produce Upkeep-main-*.AppImage.
      - name: Version sync
        run: |
          pyproject="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          module="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/upkeep/__init__.py)"
          if [ "$pyproject" != "$module" ]; then
            echo "::error::pyproject.toml ($pyproject) and __init__.py ($module) disagree"
            exit 1
          fi
          echo "UPKEEP_VERSION=${pyproject}" >> "$GITHUB_ENV"
          echo "UPKEEP_APPIMAGE=Upkeep-v${pyproject}-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "building Upkeep-v${pyproject}-x86_64.AppImage"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$pyproject" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version ${pyproject}"
            exit 1
          fi

      - name: Tests
        run: PYTHONPATH=src python3 -m pytest tests/ -q

      - name: appimagetool
        run: |
          curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: ./packaging/build-appimage.sh
        env:
          ARCH: x86_64

      # A workflow_dispatch run publishes nothing, so without this the only
      # way to get the artifact out is to cut a release.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: upkeep-appimage
          path: ${{ env.UPKEEP_APPIMAGE }}
          if-no-files-found: error

      - name: Smoke test
        run: |
          IMG="$UPKEEP_APPIMAGE"
          ls -la "$IMG"
          file "$IMG"
          chmod +x "$IMG"
          "$IMG" list
          # `self` exits 0 current, 10 newer, 1 no release yet / offline.
          "$IMG" self || [ $? -le 10 ]

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Upkeep-*-x86_64.AppImage \
            --title "Upkeep $GITHUB_REF_NAME" \
            --generate-notes